[project]
name = "evernote-exporter"
version = "0.1.0"
description = "Personal one-shot Evernote → Obsidian migration tool"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
evernote-exporter = "evernote_exporter.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
